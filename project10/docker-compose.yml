version: "3.8"

services:
  backend:
    build: ./backend
    container_name: backend
    depends_on:
      - mongo
  mongo:
    image: mongo
    container_name: mongo
    volumes:
      - mongo_data:/data/db
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8089:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
volumes:
  mongo_data: